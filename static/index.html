<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Agent</title>
<link rel="icon" href="/static/icon.png">
<style>
@font-face { font-family: "Poppins"; font-weight: 800; src: url(/fonts/Poppins-ExtraBold.ttf) format("truetype"); font-display: swap; }
@font-face { font-family: "Poppins"; font-weight: 900; src: url(/fonts/Poppins-Black.ttf) format("truetype"); font-display: swap; }

:root {
  --bg: #1C1E24;
  --panel: #262931;
  --panel-2: #2E323C;
  --line: #363A45;
  --text: #F2F3F5;
  --muted: #9AA0AD;
  --hl: #FFE500;        /* caption highlight: the same yellow the clips use */
  --part: #FF2D55;      /* the Part pill red from the clips */
  --ok: #3DDC84;
  --display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; border-radius: 6px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }

/* ---------- top bar */
header.top { display: flex; align-items: center; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(28,30,36,.92); backdrop-filter: blur(8px); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-weight: 900; font-size: 19px; letter-spacing: -.01em; }
.brand svg { flex: none; }
header.top nav { margin-left: auto; display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--panel); }
.btn.primary { background: var(--hl); color: #15161A; border-color: var(--hl); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: #FF8A9F; }

main { max-width: 1080px; margin: 0 auto; padding: 0 28px 140px; }

/* ---------- home */
.hero { padding: 72px 0 28px; }
.hero h1 { font-family: var(--display); font-weight: 900; font-size: clamp(38px, 6.4vw, 72px); line-height: 1.02; letter-spacing: -.025em; margin: 0 0 18px; max-width: 13ch; }
.hero h1 .w { display: inline-block; transition: color .12s, transform .12s; }
.hero h1 .w.on { color: var(--hl); transform: scale(1.04); }
.hero p.lede { color: var(--muted); font-size: 18px; max-width: 54ch; margin: 0; }

.finder { margin-top: 34px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px; transition: border-color .15s; }
.finder.drag { border-color: var(--hl); }
.finder .row { display: flex; gap: 10px; }
.finder input.link { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; font-size: 17px; }
.finder input.link::placeholder { color: #6C7280; }
.finder .go { padding: 0 26px; font-size: 16px; border-radius: 12px; }
.file-chip { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; flex: 1; min-width: 0; }
.file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opts { display: flex; flex-wrap: wrap; gap: 18px 26px; padding: 16px 8px 6px; align-items: center; }
.opt { display: flex; align-items: center; gap: 10px; }
.opt > label, .opt > .lbl { color: var(--muted); font-size: 14px; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--text); color: #15161A; font-weight: 600; }
.opt input.notes { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; width: 300px; max-width: 60vw; font-size: 14px; }
.subactions { display: flex; gap: 16px; padding: 4px 8px 6px; font-size: 14px; }
.linkish { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #555B68; }
.linkish:hover { color: var(--text); }

/* setup card */
.setup { margin-top: 34px; border: 1px solid var(--hl); border-radius: 18px; padding: 24px; background: linear-gradient(0deg, rgba(255,229,0,.04), rgba(255,229,0,.04)), var(--panel); }
.setup h2 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0 0 6px; }
.setup ol { margin: 16px 0 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 14px; }
.setup li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.setup li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--hl); color: #15161A; font-weight: 800; display: grid; place-items: center; font-family: var(--display); }
.setup .keyrow { display: flex; gap: 10px; margin-top: 6px; }
.setup input { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }

/* progress */
.progress { margin-top: 34px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; }
.progress h2 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0 0 18px; }
.steps { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 9px 0; color: var(--muted); }
.steps li .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); justify-self: center; }
.steps li.now { color: var(--text); font-weight: 600; }
.steps li.now .dot { border-color: var(--hl); background: var(--hl); box-shadow: 0 0 0 5px rgba(255,229,0,.15); animation: pulse 1.4s infinite; }
.steps li.did { color: var(--text); }
.steps li.did .dot { border-color: var(--ok); background: var(--ok); }
.steps li.fail { color: var(--text); font-weight: 600; }
.steps li.fail .dot { border-color: var(--part); background: var(--part); }
.bar { height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--hl); width: 0; transition: width .4s; }
.lastlog { margin-top: 16px; font-size: 13px; color: var(--muted); min-height: 20px; }
.err { margin-top: 16px; border-left: 3px solid var(--part); background: rgba(255,45,85,.08); padding: 12px 14px; border-radius: 0 10px 10px 0; }
.err b { display: block; margin-bottom: 4px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(255,229,0,0); } }

/* recent */
.recent { margin-top: 64px; }
.recent h2, .section-h { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 0 0 14px; }
.plist { display: grid; gap: 2px; }
.prow { display: grid; grid-template-columns: 148px 1fr auto; gap: 18px; align-items: center; padding: 10px; border-radius: 14px; text-decoration: none; }
.prow:hover { background: var(--panel); }
.thumb { position: relative; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: var(--panel-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.78); font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 5px; }
.prow .t { font-weight: 600; font-size: 16px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prow .s { color: var(--muted); font-size: 14px; margin-top: 3px; }
.empty { color: var(--muted); padding: 18px 10px; }

/* ---------- project */
.phead { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; padding: 36px 0 26px; }
.phead h1 { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 3vw, 30px); line-height: 1.15; margin: 4px 0 10px; }
.phead .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.back { color: var(--muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--text); }

/* timeline: the signature element */
.timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 12px; }
.timeline .cap { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.track { position: relative; height: 64px; background: repeating-linear-gradient(90deg, transparent 0 calc(var(--tick) - 1px), var(--line) calc(var(--tick) - 1px) var(--tick)); border-bottom: 2px solid var(--line); }
.mark { position: absolute; bottom: 0; min-width: 7px; background: var(--hl); border-radius: 3px 3px 0 0; cursor: pointer; border: 0; padding: 0; opacity: .9; }
.mark.off { background: transparent; box-shadow: inset 0 0 0 2px rgba(255,229,0,.55); }
.mark.series { box-shadow: 0 -4px 0 var(--part) inset; }
.mark:hover, .mark:focus-visible { opacity: 1; filter: brightness(1.15); z-index: 2; }
.ticks { position: relative; height: 18px; font-size: 11px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); top: 4px; }
.tip { position: fixed; pointer-events: none; background: #0F1013; border: 1px solid var(--line); padding: 8px 10px; border-radius: 8px; font-size: 13px; max-width: 280px; z-index: 50; }

/* clip rows */
.cliplist { display: grid; gap: 14px; margin-top: 30px; }
.clip { display: grid; grid-template-columns: 188px 1fr; gap: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; transition: border-color .2s, box-shadow .2s; }
.clip.sel { border-color: rgba(255,229,0,.55); }
.clip.flash { box-shadow: 0 0 0 3px var(--hl); }

/* phone mock = what the clip will look like */
.phone { position: relative; width: 188px; aspect-ratio: 9/16; border-radius: 22px; overflow: hidden; background: #000; border: 1px solid #3E4350; }
.phone video { width: 100%; height: 100%; display: block; background: #000; }
.phone .bgimg { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(14px) brightness(.55); }
.phone .mid { position: absolute; left: 0; right: 0; top: 29.2%; height: 39.6%; background-size: cover; background-position: center; }
.phone .p-title { position: absolute; left: 10%; right: 10%; top: 17%; transform: translateY(-50%); text-align: center; }
.phone .p-title span { background: #fff; color: #000; font-family: var(--display); font-weight: 800; font-size: 10.5px; line-height: 1.55; padding: 2px 5px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.phone .p-part { position: absolute; left: 50%; top: 9.5%; transform: translateX(-50%); background: var(--part); color: #fff; font-family: var(--display); font-weight: 900; font-size: 8px; padding: 1px 6px; }
.phone .p-hook { position: absolute; left: 12%; right: 12%; top: 39.6%; transform: translateY(-50%); text-align: center; }
.phone .p-hook span { background: var(--hl); color: #000; font-family: var(--display); font-weight: 900; font-size: 11px; padding: 2px 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; line-height: 1.6; }
.phone .p-cap { position: absolute; left: 4%; right: 4%; top: 72%; transform: translateY(-50%); text-align: center; font-family: var(--display); font-weight: 900; font-size: 14px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 2px 2px #000; }
.phone .p-cap b { color: var(--hl); font-weight: 900; }
.phone .state { position: absolute; inset: 0; background: rgba(15,16,19,.72); display: grid; place-items: center; text-align: center; font-weight: 600; font-size: 14px; padding: 10px; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--hl); animation: spin .8s linear infinite; margin: 0 auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

.cbody { min-width: 0; display: flex; flex-direction: column; }
.chead { display: flex; align-items: flex-start; gap: 12px; }
.check { appearance: none; width: 22px; height: 22px; border: 2px solid #59606E; border-radius: 6px; margin: 3px 0 0; flex: none; cursor: pointer; display: grid; place-items: center; }
.check:checked { background: var(--hl); border-color: var(--hl); }
.check:checked::after { content: ""; width: 10px; height: 6px; border-left: 2.5px solid #15161A; border-bottom: 2.5px solid #15161A; transform: rotate(-45deg) translate(1px, -1px); }
.chead h3 { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.25; margin: 0; flex: 1; }
.score { flex: none; text-align: right; line-height: 1; }
.score b { font-family: var(--display); font-weight: 900; font-size: 26px; }
.score small { color: var(--muted); font-size: 12px; }
.score.hi b { color: var(--hl); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 12px 34px; }
.tag { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); color: #C9CDD6; }
.tag.part { background: var(--part); color: #fff; font-weight: 700; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
dl.details { margin: 0 0 0 34px; display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; font-size: 14.5px; }
dl.details dt { color: var(--muted); }
dl.details dd { margin: 0; }
.post { margin: 14px 0 0 34px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.post p { margin: 0; flex: 1; }
.post .tags { color: #8FB8FF; }
.cacts { margin: 14px 0 0 34px; display: flex; flex-wrap: wrap; gap: 8px; }

/* bottom make bar */
.makebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(22,24,29,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.makebar .in { max-width: 1080px; margin: 0 auto; padding: 12px 28px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
.makebar .count { font-weight: 600; min-width: 90px; }
.layouts { display: inline-flex; gap: 6px; }
.layouts button { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 5px 7px; cursor: pointer; display: grid; place-items: center; }
.layouts button[aria-pressed="true"] { border-color: var(--hl); background: var(--panel-2); }
.swatches { display: inline-flex; gap: 6px; }
.swatches button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatches button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--bg) inset; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #C9CDD6; }
.toggle input { appearance: none; width: 34px; height: 20px; border-radius: 99px; background: #4A505D; position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle input:checked { background: var(--ok); }
.toggle input:checked::after { transform: translateX(14px); }
.makebar .go { margin-left: auto; padding: 11px 22px; font-size: 15px; }
.makebar .status { width: 100%; font-size: 13px; color: var(--muted); }

/* drawer + modals */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 60; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 61; padding: 26px; overflow-y: auto; }
.drawer h2, .modal h2 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0 0 18px; }
.field { margin-bottom: 18px; }
.field > label, .field > .lbl { display: block; font-weight: 600; margin-bottom: 6px; }
.field > label.toggle { display: flex; align-items: flex-start; gap: 12px; font-weight: 600; color: var(--text); }
.field > label.toggle input { flex: none; margin-top: 2px; }
.field .hint { color: var(--muted); font-size: 13px; margin-top: 5px; }
.field input[type=text], .field input[type=password], .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.field textarea { min-height: 160px; font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; }
.radio { display: flex; gap: 8px; flex-wrap: wrap; }
.radio label { flex: 1; min-width: 150px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--bg); }
.radio input { accent-color: var(--hl); margin-right: 6px; }
.radio label:has(input:checked) { border-color: var(--hl); }
details.adv summary { cursor: pointer; color: var(--muted); margin-bottom: 12px; }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; z-index: 61; }
.modal .x { position: absolute; top: 14px; right: 14px; }
.yt { aspect-ratio: 16/9; width: 100%; border: 0; border-radius: 12px; background: #000; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--text); color: #15161A; font-weight: 600; padding: 10px 16px; border-radius: 10px; z-index: 80; }

@media (max-width: 760px) {
  header.top, main, .makebar .in { padding-left: 16px; padding-right: 16px; }
  .finder .row { flex-direction: column; }
  .finder .go { padding: 14px; }
  .prow { grid-template-columns: 110px 1fr; }
  .prow .chev { display: none; }
  .phead { grid-template-columns: 1fr; }
  .clip { grid-template-columns: 1fr; }
  .phone { margin: 0 auto; }
  .meta, dl.details, .post, .cacts { margin-left: 0; }
  .makebar .in { gap: 10px 14px; padding-top: 10px; padding-bottom: 10px; }
  .makebar .toggle, #selAll { display: none; }
  .layouts button { padding: 3px 5px; }
  .swatches button { width: 22px; height: 22px; }
  .makebar .go { width: 100%; }
  dl.details { grid-template-columns: 1fr; gap: 0 0; }
  dl.details dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Clip Agent home">
    <svg width="22" height="30" viewBox="0 0 22 30" aria-hidden="true"><rect x="1.5" y="1.5" width="19" height="27" rx="4.5" fill="none" stroke="#F2F3F5" stroke-width="2.4"/><rect x="5" y="17" width="12" height="4.5" rx="1" fill="#FFE500"/><rect x="5" y="6.5" width="12" height="3" rx="1" fill="#F2F3F5"/></svg>
    Clip Agent
  </a>
  <nav>
    <a class="btn ghost" href="#/">New video</a>
    <button class="btn ghost" id="openSettings" type="button">Settings</button>
  </nav>
</header>

<main id="view"></main>

<div id="makebar" class="makebar hidden" role="region" aria-label="Make clips"></div>
<div id="overlay"></div>
<div id="tip" class="tip hidden"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hms = s => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const store = { get(k, d) { try { const v = localStorage.getItem("ca." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("ca." + k, JSON.stringify(v)); } catch {} } };

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: opts.body && !(opts.body instanceof Blob) && !(opts.body instanceof File) ? {"Content-Type": "application/json"} : {}, ...opts });
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error((data && (data.error || data.detail)) || ("Request failed (" + r.status + ")"));
  return data;
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 1900); }

const S = { state: null, project: null, sel: new Set(), job: null, renderJob: null, file: null,
  opts: { clips: store.get("clips", 10), length: store.get("length", 40) },
  make: { layout: store.get("layout", "blur"), color: store.get("color", "#FFE500"),
          whisper: store.get("whisper", true), tighten: store.get("tighten", true) } };

/* ------------------------------------------------------------ router */
window.addEventListener("hashchange", route);
async function route() {
  $("#makebar").classList.add("hidden");
  const m = location.hash.match(/^#\/p\/(.+)$/);
  try { S.state = await api("/api/state"); } catch {}
  if (m) return showProject(decodeURIComponent(m[1]));
  showHome();
}

/* ------------------------------------------------------------ home */
async function showHome() {
  const v = $("#view");
  const needsKey = S.state && !S.state.has_key && S.state.provider === "gemini";
  v.innerHTML = `
    <section class="hero">
      <h1 id="headline">${"Paste a video. Get the clips.".split(" ").map(w => `<span class="w">${w}</span>`).join(" ")}</h1>
      <p class="lede">Finds the moments worth posting, writes the hooks and titles, and cuts vertical clips with word-by-word captions. Runs free on this computer.</p>
    </section>
    ${needsKey ? setupCard() : ""}
    <section id="finderWrap" class="${needsKey ? "hidden" : ""}">${finderHTML()}</section>
    <section id="progressWrap"></section>
    <section class="recent"><h2>Your videos</h2><div id="plist" class="plist"><div class="empty">Loading…</div></div></section>`;
  animateHeadline();
  if (needsKey) bindSetup();
  bindFinder();
  loadProjects();
  // resume a running find job
  try { const running = await api("/api/jobs"); const f = running.find(j => j.kind === "find");
        if (f) watchFind(f.id); } catch {}
}

function animateHeadline() {
  const ws = [...document.querySelectorAll("#headline .w")];
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !ws.length) return;
  ws.forEach((w, i) => { setTimeout(() => { ws.forEach(x => x.classList.remove("on")); w.classList.add("on"); }, 350 + i * 260); });
  setTimeout(() => ws.forEach(x => x.classList.remove("on")), 350 + ws.length * 260 + 500);
}

function setupCard() {
  return `<section class="setup" id="setup">
    <h2>One-time setup: connect the free AI</h2>
    <div class="muted">Google's Gemini picks the clips. Its key is free and takes a minute to get.</div>
    <ol>
      <li><div>Open Google AI Studio and sign in with any Google account.<br>
        <a class="btn small" style="margin-top:8px" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Open Google AI Studio</a></div></li>
      <li><div>Click <b>Create API key</b>, then copy the key.</div></li>
      <li><div>Paste it here.
        <div class="keyrow"><input id="setupKey" type="password" placeholder="Paste your key" aria-label="Gemini API key">
        <button class="btn primary" id="setupSave" type="button">Save key</button></div></div></li>
    </ol></section>`;
}
function bindSetup() {
  $("#setupSave").onclick = async () => {
    const k = $("#setupKey").value.trim(); if (!k) return $("#setupKey").focus();
    await api("/api/settings", { method: "POST", body: JSON.stringify({ gemini_api_key: k }) });
    toast("Key saved"); S.state.has_key = true; $("#setup").remove(); $("#finderWrap").classList.remove("hidden"); $("#link")?.focus();
  };
}

function seg(name, values, cur, fmt) {
  return `<div class="seg" role="group" aria-label="${name}">${values.map(v =>
    `<button type="button" data-${name}="${v}" aria-pressed="${v == cur}">${fmt(v)}</button>`).join("")}</div>`;
}
function finderHTML() {
  return `<div class="finder" id="finder">
    <div class="row" id="srcRow">
      ${S.file ? `<div class="file-chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg><span>${esc(S.file.name)}</span><button class="btn small ghost" id="clearFile" type="button">Remove</button></div>`
               : `<input class="link" id="link" type="url" inputmode="url" placeholder="Paste a YouTube link" aria-label="YouTube link" autocomplete="off">`}
      <button class="btn primary go" id="findBtn" type="button">Find clips</button>
    </div>
    <div class="opts">
      <div class="opt"><span class="lbl">Clips</span>${seg("clips", [5, 10, 15, 20], S.opts.clips, v => v)}</div>
      <div class="opt"><span class="lbl">Length</span>${seg("length", [20, 30, 45, 60], S.opts.length, v => v + "s")}</div>
      <div class="opt"><label for="notes">Look for</label><input class="notes" id="notes" placeholder="funny moments, money stories, heated debates…"></div>
    </div>
    <div class="subactions">
      <button class="linkish" id="pickFile" type="button">Use a video file instead</button>
      <button class="linkish" id="pastePlan" type="button">Paste a clip plan from Claude</button>
      <input type="file" id="fileIn" accept="video/*,audio/*" class="hidden">
    </div>
  </div>`;
}
function bindFinder() {
  const f = $("#finder"); if (!f) return;
  f.querySelectorAll("[data-clips]").forEach(b => b.onclick = () => { S.opts.clips = +b.dataset.clips; store.set("clips", S.opts.clips); rerenderFinder(); });
  f.querySelectorAll("[data-length]").forEach(b => b.onclick = () => { S.opts.length = +b.dataset.length; store.set("length", S.opts.length); rerenderFinder(); });
  $("#findBtn").onclick = startFind;
  $("#link")?.addEventListener("keydown", e => { if (e.key === "Enter") startFind(); });
  $("#pickFile").onclick = () => $("#fileIn").click();
  $("#fileIn").onchange = e => { if (e.target.files[0]) { S.file = e.target.files[0]; rerenderFinder(); } };
  $("#clearFile")?.addEventListener("click", () => { S.file = null; rerenderFinder(); });
  $("#pastePlan").onclick = openPaste;
  ["dragenter", "dragover"].forEach(ev => f.addEventListener(ev, e => { e.preventDefault(); f.classList.add("drag"); }));
  ["dragleave", "drop"].forEach(ev => f.addEventListener(ev, e => { e.preventDefault(); f.classList.remove("drag"); }));
  f.addEventListener("drop", e => { const file = e.dataTransfer.files[0]; if (file) { S.file = file; rerenderFinder(); } });
}
function rerenderFinder() { const notes = $("#notes")?.value || ""; const link = $("#link")?.value || "";
  $("#finderWrap").innerHTML = finderHTML(); bindFinder(); $("#notes").value = notes; if ($("#link")) $("#link").value = link; }

async function startFind() {
  const link = $("#link")?.value.trim();
  if (!S.file && !link) { $("#link")?.focus(); return toast("Paste a YouTube link first"); }
  if (link && !/^https?:\/\//.test(link)) return toast("That doesn't look like a link");
  $("#findBtn").disabled = true;
  try {
    let source = link;
    if (S.file) {
      showProgress({ stage: "upload", logs: ["Copying your video into Clip Agent…"] });
      const up = await api("/api/upload?name=" + encodeURIComponent(S.file.name), { method: "POST", body: S.file });
      source = up.path; S.file = null;
    }
    S.lastFind = { source, clips: S.opts.clips, length: S.opts.length, notes: $("#notes")?.value || "" };
    const r = await api("/api/find", { method: "POST", body: JSON.stringify(S.lastFind) });
    watchFind(r.job);
  } catch (e) { $("#findBtn").disabled = false; showProgress({ status: "error", error: e.message, logs: [] }); }
}

const FIND_STEPS = [["info", "Reading the video"], ["captions", "Getting the captions"], ["ai", "Finding the best moments"], ["done", "Clip plan ready"]];
function showProgress(j) {
  $("#finderWrap")?.classList.add("hidden");
  const order = FIND_STEPS.map(s => s[0]);
  const cur = j.stage === "waiting" || j.stage === "upload" ? -1 : order.indexOf(j.stage);
  const p = j.progress;
  const err = j.status === "error";
  const failAt = err ? Math.max(0, cur) : -1;
  $("#progressWrap").innerHTML = `<div class="progress" aria-live="polite">
    <h2>${err ? "That didn't work" : j.stage === "upload" ? "Adding your video" : "Working on it"}</h2>
    ${j.stage === "upload" && !err ? "" : `<ol class="steps">${FIND_STEPS.map(([k, label], i) => `
      <li class="${err ? (i < failAt ? "did" : i === failAt ? "fail" : "") : i < cur || j.status === "done" ? "did" : i === cur ? "now" : ""}"><span class="dot"></span>
        <span>${label}${err && i === failAt ? ` <span class="muted" style="font-weight:400">stopped here</span>` : ""}${k === "ai" && p && i === cur && !err ? `<div class="bar"><i style="width:${Math.round((p[0] - 1) / p[1] * 100 + 100 / p[1] / 2)}%"></i></div>` : ""}</span>
        <span class="muted">${k === "ai" && p && i === cur ? `part ${p[0]} of ${p[1]}` : ""}</span></li>`).join("")}</ol>`}
    ${err ? errorBox(j.error) : `<div class="lastlog">${esc((j.logs || []).slice(-1)[0] || "")}${j.elapsed ? ` <span>(${hms(j.elapsed)})</span>` : ""}</div>`}
  </div>`;
  $("#retry")?.addEventListener("click", async () => {
    if (!S.lastFind) return backToFinder();
    try { const r = await api("/api/find", { method: "POST", body: JSON.stringify(S.lastFind) }); watchFind(r.job); }
    catch (e) { toast(e.message); }
  });
  $("#changeVideo")?.addEventListener("click", backToFinder);
  $("#errSettings")?.addEventListener("click", openSettings);
}
function backToFinder() { $("#progressWrap").innerHTML = ""; $("#finderWrap").classList.remove("hidden"); const b = $("#findBtn"); if (b) b.disabled = false; }
function errorBox(msg) {
  const m = (msg || "").toLowerCase();
  let fix = "";
  if (m.includes("cookie")) fix = "Clip Agent couldn't read your browser's YouTube login. In Settings, set the browser option to \"Don't read it from a browser\", or upload a login file instead.";
  else if (m.includes("timed out") || m.includes("timeout") || m.includes("connection")) fix = "The internet connection was too slow or dropped for a moment. Press Try again: it picks up where it stopped. If it keeps happening, try a different Wi-Fi or turn off any VPN.";
  else if (m.includes("429") || m.includes("rate-limit") || m.includes("bot")) fix = "YouTube is limiting requests. Wait 20–30 minutes, or in Settings choose the browser you're signed in to YouTube with.";
  else if (m.includes("api key") || m.includes("gemini rejected")) fix = "Check your Gemini key in Settings.";
  else if (m.includes("free requests") || m.includes("free-tier limit")) fix = "Waiting won't help today. After the reset, press Try again and it continues where it stopped. Or paste a clip plan from Claude now (on the home page).";
  else if (m.includes("ffmpeg") || m.includes("download")) fix = "Try again in a minute. If it keeps happening, close Clip Agent and open it from the desktop icon so it can update.";
  return `<div class="err"><b>${esc(msg || "Something went wrong.")}</b>${fix ? `<span class="muted">${esc(fix)}</span>` : ""}</div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary" id="retry" type="button">Try again</button>
    <button class="btn ghost" id="changeVideo" type="button">Use a different video</button>
    ${fix.includes("Settings") ? `<button class="btn ghost" id="errSettings" type="button">Open Settings</button>` : ""}</div>`;
}
async function watchFind(id) {
  S.job = id;
  const tick = async () => {
    if (S.job !== id) return;
    let j; try { j = await api("/api/jobs/" + id); } catch { return setTimeout(tick, 1500); }
    if (!$("#progressWrap")) return;
    if (j.status === "done") { S.job = null; location.hash = "#/p/" + encodeURIComponent(j.result.project); return; }
    showProgress(j);
    if (j.status !== "error") setTimeout(tick, 900); else S.job = null;
  };
  tick();
}

async function loadProjects() {
  let list = []; try { list = await api("/api/projects"); } catch {}
  const el = $("#plist"); if (!el) return;
  if (!list.length) { el.innerHTML = `<div class="empty">Videos you clip show up here.</div>`; return; }
  el.innerHTML = list.map(p => `<a class="prow" href="#/p/${encodeURIComponent(p.id)}">
      <div class="thumb">${p.thumb ? `<img src="${esc(p.thumb)}" alt="" loading="lazy">` : ""}${p.duration ? `<span class="dur">${hms(p.duration)}</span>` : ""}</div>
      <div><div class="t">${esc(p.title)}</div><div class="s">${p.clips ? `${p.clips} clips found${p.made ? `, ${p.made} made` : ""}` : "No clip plan yet"}</div></div>
      <span class="chev muted" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>`).join("");
}

/* ------------------------------------------------------------ project */
async function showProject(pid) {
  const v = $("#view");
  v.innerHTML = `<div class="empty" style="padding:60px 0">Loading…</div>`;
  let p; try { p = await api("/api/projects/" + encodeURIComponent(pid)); }
  catch (e) { v.innerHTML = `<div class="err" style="margin-top:40px"><b>${esc(e.message)}</b></div><p><a class="back" href="#/">Back to your videos</a></p>`; return; }
  S.project = p;
  const prevPid = S.selPid; S.selPid = pid;
  if (prevPid !== pid) S.sel = new Set(p.clips.filter(c => !p.rendered[c.n]).map(c => c.n));
  const vid = p.video, dur = vid.duration || Math.max(...p.clips.map(c => c.end), 60);
  v.innerHTML = `
    <div class="phead">
      <div class="thumb">${p.thumb ? `<img src="${esc(p.thumb)}" alt="">` : ""}<span class="dur">${hms(dur)}</span></div>
      <div><a class="back" href="#/">← Your videos</a>
        <h1>${esc(vid.title)}</h1>
        <div class="muted">${p.clips.length} clips found${Object.keys(p.rendered).length ? `, ${Object.keys(p.rendered).length} made` : ""}</div>
        <div class="acts">
          ${Object.keys(p.rendered).length ? `<button class="btn small" id="openFolder" type="button">Open clips folder</button>` : ""}
          ${vid.is_url && vid.url ? `<a class="btn small" href="${esc(vid.url)}" target="_blank" rel="noopener">Watch on YouTube</a>` : ""}
          <button class="btn small ghost danger" id="delProject" type="button">Delete</button>
        </div></div>
    </div>
    ${timelineHTML(p, dur)}
    <div class="cliplist" id="cliplist">${p.clips.map(c => clipHTML(p, c)).join("")}</div>`;
  bindProject(p, dur);
  renderMakebar();
  resumeRender(pid);
}

function timelineHTML(p, dur) {
  const step = dur > 7200 ? 3600 : dur > 1800 ? 600 : dur > 600 ? 300 : 60;
  const ticks = []; for (let t = step; t < dur; t += step) ticks.push(t);
  const tickPct = step / dur * 100;
  return `<section class="timeline" aria-label="Where the clips are in the video">
    <div class="cap"><span>Where the clips are</span><span>taller = higher score</span></div>
    <div class="track" id="track" style="--tick:${tickPct}%">
      ${p.clips.map(c => { const l = c.start / dur * 100, w = Math.max((c.end - c.start) / dur * 100, 0);
        const h = 28 + Math.max(0, (c.score || 25) - 20) / 30 * 72;
        return `<button class="mark ${S.sel.has(c.n) ? "" : "off"} ${c.series ? "series" : ""}" type="button" data-n="${c.n}"
          style="left:${l}%;width:${w}%;height:${Math.min(100, h)}%" aria-label="Clip ${c.n}: ${esc(c.title_top)} at ${hms(c.start)}"></button>`; }).join("")}
    </div>
    <div class="ticks">${ticks.map(t => `<span style="left:${t / dur * 100}%">${hms(t)}</span>`).join("")}</div>
  </section>`;
}

function phoneMock(p, c) {
  const r = p.rendered[c.n];
  if (r) return `<div class="phone"><video src="${esc(r.url)}?v=${Math.round(r.mtime)}" controls preload="metadata" playsinline></video></div>`;
  const img = p.thumb ? `url('${p.thumb.replace(/'/g, "%27")}')` : "none";
  const hook = c.series && c.series.part > 1 && c.part2_recap ? c.part2_recap : c.hook_text;
  const capWords = (c.start_quote || "").replace(/[.,!?;:"]/g, "").split(/\s+/).filter(Boolean).slice(0, 3).map(w => w.toUpperCase());
  const cap = capWords.map((w, i) => i === 1 ? `<b>${esc(w)}</b>` : esc(w)).join(" ");
  return `<div class="phone" aria-hidden="true">
    <div class="bgimg" style="background-image:${img}"></div>
    <div class="mid" style="background-image:${img}"></div>
    ${c.series ? `<div class="p-part">PART ${c.series.part}</div>` : ""}
    <div class="p-title"><span>${esc(c.title_top)}</span></div>
    ${hook ? `<div class="p-hook"><span>${esc(String(hook).length < 40 ? String(hook).toUpperCase() : hook)}</span></div>` : ""}
    <div class="p-cap">${cap}</div>
    <div class="state hidden"></div>
  </div>`;
}

function clipHTML(p, c) {
  const s = c.series, r = p.rendered[c.n];
  const yt = p.video.is_url && p.video.id;
  return `<article class="clip ${S.sel.has(c.n) ? "sel" : ""}" id="clip-${c.n}" data-n="${c.n}">
    <div class="pwrap">${phoneMock(p, c)}</div>
    <div class="cbody">
      <div class="chead">
        <input type="checkbox" class="check" data-n="${c.n}" ${S.sel.has(c.n) ? "checked" : ""} aria-label="Make clip ${c.n}">
        <h3>${esc(c.title_top || "Clip " + c.n)}</h3>
        <div class="score ${c.score >= 40 ? "hi" : ""}" title="Hook ${c.scores?.hook ?? "–"}, emotion ${c.scores?.emotion ?? "–"}, makes sense alone ${c.scores?.standalone ?? "–"}, payoff ${c.scores?.payoff ?? "–"}, shareable ${c.scores?.shareability ?? "–"}"><b>${c.score ?? "–"}</b><small>/50</small></div>
      </div>
      <div class="meta">
        <span class="time">${hms(c.start)} – ${hms(c.end)}</span><span class="tag">${Math.round(c.length || (c.end - c.start))}s</span>
        ${c.type ? `<span class="tag">${esc(c.type)}</span>` : ""}
        ${s ? `<span class="tag part">Part ${s.part} of ${s.of || 2}</span>` : ""}
        ${c.cold_open ? `<span class="tag" title="Opens with: “${esc(c.cold_open.quote)}”">teaser opening</span>` : ""}
      </div>
      <dl class="details">
        ${c.hook_text ? `<dt>Hook</dt><dd>${esc(c.hook_text)}</dd>` : ""}
        ${c.part2_recap ? `<dt>Part 2 recap</dt><dd>${esc(c.part2_recap)}</dd>` : ""}
        ${c.start_quote ? `<dt>Opens with</dt><dd>“${esc(c.start_quote)}…”</dd>` : ""}
        ${c.end_quote ? `<dt>Ends with</dt><dd>“…${esc(c.end_quote)}”${c.ending ? ` <span class="muted">(${esc(c.ending)})</span>` : ""}</dd>` : ""}
        ${c.why ? `<dt>Why it works</dt><dd>${esc(c.why)}</dd>` : ""}
      </dl>
      ${c.post_caption || (c.hashtags || []).length ? `<div class="post"><p>${esc(c.post_caption || "")} <span class="tags">${esc((c.hashtags || []).join(" "))}</span></p>
        <button class="btn small" type="button" data-copy="${c.n}">Copy caption</button></div>` : ""}
      <div class="cacts">
        ${yt ? `<button class="btn small" type="button" data-preview="${c.n}">Preview the moment</button>` : ""}
        ${r ? `<a class="btn small primary" href="${esc(r.url)}" download="${esc(r.name)}">Download clip</a>` : ""}
      </div>
    </div></article>`;
}

function bindProject(p, dur) {
  $("#openFolder")?.addEventListener("click", () => api("/api/open-folder", { method: "POST", body: JSON.stringify({ project: p.id }) }));
  $("#delProject").onclick = async () => { if (!confirm("Delete this video's clip plan and any clips you made from it?")) return;
    await api("/api/projects/" + encodeURIComponent(p.id), { method: "DELETE" }); location.hash = "#/"; };
  document.querySelectorAll(".check").forEach(cb => cb.onchange = () => setSel(+cb.dataset.n, cb.checked));
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const c = p.clips.find(x => x.n == b.dataset.copy);
    const text = [c.post_caption, (c.hashtags || []).join(" ")].filter(Boolean).join(" ");
    try { await navigator.clipboard.writeText(text); toast("Caption copied"); } catch { prompt("Copy the caption:", text); }
  });
  document.querySelectorAll("[data-preview]").forEach(b => b.onclick = () => openPreview(p, p.clips.find(x => x.n == b.dataset.preview)));
  const tip = $("#tip");
  document.querySelectorAll(".mark").forEach(m => {
    const c = p.clips.find(x => x.n == m.dataset.n);
    m.onmouseenter = e => { tip.innerHTML = `<b>${esc(c.title_top)}</b><br><span class="muted">${hms(c.start)}, score ${c.score}/50</span>`; tip.classList.remove("hidden"); };
    m.onmousemove = e => { tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px"; tip.style.top = (e.clientY + 16) + "px"; };
    m.onmouseleave = () => tip.classList.add("hidden");
    m.onclick = () => { const el = $("#clip-" + c.n); el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1300); };
  });
}
function setSel(n, on) {
  on ? S.sel.add(n) : S.sel.delete(n);
  $("#clip-" + n)?.classList.toggle("sel", on);
  const cb = $(`#clip-${n} .check`); if (cb) cb.checked = on;
  $(`.mark[data-n="${n}"]`)?.classList.toggle("off", !on);
  renderMakebar();
}

const LAYOUT_ICONS = {
  blur: ["Blurred background", `<svg width="22" height="34" viewBox="0 0 22 34"><rect x="1" y="1" width="20" height="32" rx="3" fill="#4A505D"/><rect x="1" y="11" width="20" height="12" fill="#C9CDD6"/></svg>`],
  fill: ["Full-screen crop", `<svg width="22" height="34" viewBox="0 0 22 34"><rect x="1" y="1" width="20" height="32" rx="3" fill="#C9CDD6"/></svg>`],
  stack: ["Split screen, two people", `<svg width="22" height="34" viewBox="0 0 22 34"><rect x="1" y="1" width="20" height="15.5" rx="3" fill="#C9CDD6"/><rect x="1" y="17.5" width="20" height="15.5" rx="3" fill="#8F95A3"/></svg>`] };
const COLORS = [["#FFE500", "Yellow"], ["#3DFF6E", "Green"], ["#22D3EE", "Cyan"], ["#FF3B3B", "Red"], ["#FF9F1C", "Orange"]];

function renderMakebar(status) {
  const bar = $("#makebar"); if (!S.project) return;
  const busy = !!S.renderJob;
  const k = S.sel.size;
  bar.classList.remove("hidden");
  bar.innerHTML = `<div class="in">
    <span class="count">${k} selected</span>
    <button class="linkish" id="selAll" type="button">${k === S.project.clips.length ? "Select none" : "Select all"}</button>
    <div class="layouts" role="group" aria-label="Layout">${Object.entries(LAYOUT_ICONS).map(([key, [label, svg]]) =>
      `<button type="button" title="${label}" aria-label="${label}" aria-pressed="${S.make.layout === key}" data-layout="${key}">${svg}</button>`).join("")}</div>
    <div class="swatches" role="group" aria-label="Caption highlight color">${COLORS.map(([hex, name]) =>
      `<button type="button" title="${name}" aria-label="${name} captions" aria-pressed="${S.make.color === hex}" data-color="${hex}" style="background:${hex}"></button>`).join("")}</div>
    <label class="toggle" title="Re-listens to each clip so caption timing is exact. Slower."><input type="checkbox" id="tWhisper" ${S.make.whisper ? "checked" : ""}>Exact captions</label>
    <label class="toggle" title="Removes pauses longer than about 3/4 of a second"><input type="checkbox" id="tTighten" ${S.make.tighten ? "checked" : ""}>Cut pauses</label>
    <button class="btn primary go" id="makeBtn" type="button" ${!k || busy ? "disabled" : ""}>${busy ? "Making clips…" : `Make ${k} clip${k === 1 ? "" : "s"}`}</button>
    ${status ? `<div class="status" aria-live="polite">${status}</div>` : ""}
  </div>`;
  $("#selAll").onclick = () => { const all = k !== S.project.clips.length; S.project.clips.forEach(c => setSel(c.n, all)); };
  bar.querySelectorAll("[data-layout]").forEach(b => b.onclick = () => { S.make.layout = b.dataset.layout; store.set("layout", S.make.layout); renderMakebar(status); });
  bar.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { S.make.color = b.dataset.color; store.set("color", S.make.color); renderMakebar(status); });
  $("#tWhisper").onchange = e => { S.make.whisper = e.target.checked; store.set("whisper", S.make.whisper); };
  $("#tTighten").onchange = e => { S.make.tighten = e.target.checked; store.set("tighten", S.make.tighten); };
  $("#makeBtn").onclick = startRender;
}

async function startRender() {
  const clips = [...S.sel].sort((a, b) => a - b);
  try {
    const r = await api("/api/render", { method: "POST", body: JSON.stringify({ project: S.project.id, clips,
      layout: S.make.layout, color: S.make.color, whisper: S.make.whisper, tighten: S.make.tighten }) });
    watchRender(r.job, S.project.id);
  } catch (e) { toast(e.message); }
}
async function resumeRender(pid) {
  if (S.renderJob) return watchRender(S.renderJob, pid);
  try { const running = await api("/api/jobs"); const r = running.find(j => j.kind === "render" && j.project === pid); if (r) watchRender(r.id, pid); } catch {}
}
function setPhoneState(n, text) {
  const st = $(`#clip-${n} .state`); if (!st) return;
  if (!text) return st.classList.add("hidden");
  st.classList.remove("hidden"); st.innerHTML = `<div><div class="spin"></div>${esc(text)}</div>`;
}
async function watchRender(id, pid) {
  S.renderJob = id; renderMakebar("Starting…");
  let doneSeen = new Set();
  const tick = async () => {
    if (!S.project || S.project.id !== pid) { setTimeout(tick, 1500); return; }
    let j; try { j = await api("/api/jobs/" + id); } catch { return setTimeout(tick, 1500); }
    const states = j.clip_states || {};
    const order = Object.keys(states).map(Number).sort((a, b) => a - b);
    const done = order.filter(n => states[n] === "done").length, total = order.length;
    let newlyDone = false;
    for (const n of order) {
      const s = states[n];
      setPhoneState(n, s === "queued" ? "Waiting…" : s === "downloading" ? "Getting this part…" : s === "rendering" ? "Rendering…" : s === "failed" ? "" : "");
      if (s === "done" && !doneSeen.has(n)) { doneSeen.add(n); newlyDone = true; }
    }
    if (newlyDone) await refreshRendered(pid);
    const failed = order.filter(n => states[n] === "failed");
    if (j.status === "running" || j.status === "waiting") {
      renderMakebar(`Making clip ${Math.min(done + 1, total)} of ${total}. ${esc((j.logs || []).slice(-1)[0] || "")}`);
      setTimeout(tick, 1000);
    } else {
      S.renderJob = null;
      await refreshRendered(pid);
      if (j.status === "error") renderMakebar(`<span style="color:#FF8A9F">${esc(j.error)}</span>`);
      else renderMakebar(`${done} clip${done === 1 ? "" : "s"} made${failed.length ? `, ${failed.length} failed (#${failed.join(", #")})` : ""}. They're in your clips folder too.`);
      if (done) toast(done === 1 ? "Clip ready" : `${done} clips ready`);
    }
  };
  tick();
}
async function refreshRendered(pid) {
  try {
    const p = await api("/api/projects/" + encodeURIComponent(pid));
    for (const c of p.clips) {
      const before = S.project.rendered[c.n]?.mtime, after = p.rendered[c.n]?.mtime;
      if (after && after !== before) {
        S.project.rendered = p.rendered;
        const wrap = $(`#clip-${c.n} .pwrap`); if (wrap) wrap.innerHTML = phoneMock(p, c);
        const acts = $(`#clip-${c.n} .cacts`);
        if (acts && !acts.querySelector("[download]")) acts.insertAdjacentHTML("beforeend", `<a class="btn small primary" href="${esc(p.rendered[c.n].url)}" download="${esc(p.rendered[c.n].name)}">Download clip</a>`);
        setSel(c.n, false);
      }
    }
    S.project.rendered = p.rendered;
  } catch {}
}

/* ------------------------------------------------------------ overlays */
function closeOverlay() { $("#overlay").innerHTML = ""; document.removeEventListener("keydown", escClose); }
function escClose(e) { if (e.key === "Escape") closeOverlay(); }
function overlay(html, cls = "modal") {
  $("#overlay").innerHTML = `<div class="scrim" id="scrim"></div><div class="${cls}" role="dialog" aria-modal="true">${html}</div>`;
  $("#scrim").onclick = closeOverlay; document.addEventListener("keydown", escClose);
  $(`#overlay .${cls} [data-close]`)?.addEventListener("click", closeOverlay);
}
function openPreview(p, c) {
  const start = Math.floor(c.start), end = Math.ceil(c.end);
  overlay(`<button class="btn small ghost x" data-close type="button">Close</button>
    <h2>${esc(c.title_top)}</h2>
    <iframe class="yt" src="https://www.youtube-nocookie.com/embed/${esc(p.video.id)}?start=${start}&end=${end}&autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen title="Preview"></iframe>
    <p class="muted" style="margin:12px 0 0">Plays ${hms(start)} to ${hms(end)} of the original video. The finished clip trims pauses and adds the title, hook and captions.</p>`);
}
function openPaste() {
  overlay(`<button class="btn small ghost x" data-close type="button">Close</button>
    <h2>Paste a clip plan from Claude</h2>
    <p class="muted" style="margin-top:-8px">Ask Claude for a clip plan "in Clip Agent JSON" for your video, then paste it here.</p>
    <div class="field"><label for="pUrl">YouTube link</label><input type="text" id="pUrl" placeholder="https://www.youtube.com/watch?v=…"></div>
    <div class="field"><label for="pPlan">Clip plan</label><textarea id="pPlan" placeholder='{"clips": [ ... ]}'></textarea></div>
    <button class="btn primary" id="pGo" type="button">Load plan</button>`);
  $("#pGo").onclick = async () => {
    try { const r = await api("/api/paste", { method: "POST", body: JSON.stringify({ url: $("#pUrl").value.trim(), plan: $("#pPlan").value }) });
          closeOverlay(); if (!location.hash.match(/^#\/?$/)) location.hash = "#/"; setTimeout(() => watchFind(r.job), 50); }
    catch (e) { toast(e.message); }
  };
}

$("#openSettings").onclick = openSettings;
async function openSettings() {
  let st = S.state; try { st = S.state = await api("/api/state"); } catch {}
  const s = st?.settings || {};
  const upd = st?.update || {};
  overlay(`<button class="btn small ghost x" data-close type="button">Close</button>
    <h2>Settings</h2>
    <div class="field"><span class="lbl">AI that picks the clips</span>
      <div class="radio"><label><input type="radio" name="prov" value="gemini" ${s.provider !== "ollama" ? "checked" : ""}>Gemini (free key)</label>
      <label><input type="radio" name="prov" value="ollama" ${s.provider === "ollama" ? "checked" : ""}>Ollama (offline)</label></div></div>
    <div class="field"><label for="sKey">Gemini key</label><input type="password" id="sKey" placeholder="${st?.key_hint ? "Saved (" + esc(st.key_hint) + "). Paste a new one to replace it." : "Paste your key"}">
      <div class="hint">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</div></div>
    <div class="field"><span class="lbl">If YouTube blocks you</span>
      <div class="hint" style="margin:0 0 10px">Giving Clip Agent your YouTube login makes "too many requests" and "confirm you're not a bot" blocks much rarer. It stays on this computer.</div>
      ${st?.has_cookies_file ? `<div class="post" style="margin:0 0 10px;align-items:center"><p>YouTube login file saved. Clip Agent uses it for every download.</p><button class="btn small ghost danger" id="sCookieDel" type="button">Remove</button></div>` : ""}
      <details class="adv" ${st?.has_cookies_file ? "" : "open"}><summary>${st?.has_cookies_file ? "Replace the login file" : "Add your login (works with Chrome)"}</summary>
        <ol class="hint" style="margin:0 0 10px;padding-left:18px">
          <li>In Chrome, install the <a href="https://chromewebstore.google.com/search/Get%20cookies.txt%20LOCALLY" target="_blank" rel="noopener">Get cookies.txt LOCALLY</a> extension.</li>
          <li>Open youtube.com, signed in. Click the extension, then <b>Export</b>.</li>
          <li>Upload the file it saves here.</li></ol>
        <input type="file" id="sCookieFile" accept=".txt,text/plain" class="hidden">
        <button class="btn small" id="sCookieUp" type="button">Upload login file</button>
        <div class="hint">YouTube can flag accounts used with downloaders. A spare Google account is the safest choice.</div>
      </details>
      <label for="sCookies" class="hint" style="display:block;margin-top:10px">Or read the login straight from a browser:</label>
      <select id="sCookies">${[["", "Don't read it from a browser"], ["firefox", "Firefox (no prompt)"], ["safari", "Safari (may need Full Disk Access)"], ["chrome", "Chrome (asks for your Mac login password)"], ["edge", "Edge (asks for your Mac login password)"], ["brave", "Brave (asks for your Mac login password)"]].map(([b, label]) => `<option value="${b}" ${(s.cookies_browser || "") === b ? "selected" : ""}>${label}</option>`).join("")}</select>
    </div>
    <div class="field"><label class="toggle"><input type="checkbox" id="sWfb" ${s.whisper_fallback !== false ? "checked" : ""}>If captions are blocked, transcribe the audio on this computer</label>
      <div class="hint">Slower (roughly 10 minutes per hour of video) but always works.</div></div>
    <details class="adv"><summary>Advanced</summary>
      <div class="field"><label for="sModel">Gemini model</label><input type="text" id="sModel" placeholder="Automatic (recommended)" value="${esc(s.gemini_model || "")}"><div class="hint">Leave empty to use the best free Flash model your key has.</div></div>
      <div class="field"><label for="sOllama">Ollama model</label><input type="text" id="sOllama" value="${esc(s.ollama_model || "llama3.1:8b")}"></div>
    </details>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="sSave" type="button">Save settings</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:24px 0">
    <div class="field"><span class="lbl">Version ${esc(st?.version || "")}</span>
      <div class="hint">${upd.checked ? (upd.error ? "Couldn't check for updates last time." : upd.updated ? "Updated to the latest version when it opened." : "Up to date.") : "Checks for updates every time it opens."}</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn small" id="sUpdate" type="button">Check for updates now</button>
      <button class="btn small ghost danger" id="sQuit" type="button">Quit Clip Agent</button></div></div>`, "drawer");
  $("#sSave").onclick = async () => {
    const body = { provider: document.querySelector("input[name=prov]:checked").value, cookies_browser: $("#sCookies").value,
      whisper_fallback: $("#sWfb").checked, gemini_model: $("#sModel").value.trim(), ollama_model: $("#sOllama").value.trim() };
    if ($("#sKey").value.trim()) body.gemini_api_key = $("#sKey").value.trim();
    await api("/api/settings", { method: "POST", body: JSON.stringify(body) }); toast("Settings saved"); closeOverlay(); route();
  };
  $("#sCookieUp").onclick = () => $("#sCookieFile").click();
  $("#sCookieFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const r = await api("/api/cookies", { method: "POST", body: f }); toast("YouTube login saved"); openSettings(); }
    catch (err) { toast(err.message); }
  };
  $("#sCookieDel")?.addEventListener("click", async () => { await api("/api/cookies", { method: "DELETE" }); toast("Login file removed"); openSettings(); });
  $("#sUpdate").onclick = async () => {
    $("#sUpdate").disabled = true; $("#sUpdate").textContent = "Checking…";
    try { const r = await api("/api/update", { method: "POST" });
      if (r.updated) { toast("Updated. Restarting…"); setTimeout(() => location.reload(), 6000); }
      else { $("#sUpdate").textContent = r.error ? "Couldn't reach GitHub" : "You're up to date"; } }
    catch { $("#sUpdate").textContent = "Couldn't check"; }
  };
  $("#sQuit").onclick = async () => { if (!confirm("Quit Clip Agent? Open it again from the desktop icon.")) return;
    try { await api("/api/quit", { method: "POST" }); } catch {}
    document.body.innerHTML = `<main><section class="hero"><h1>Clip Agent is closed.</h1><p class="lede">Open it again from the Clip Agent icon on your desktop.</p></section></main>`; };
}

route();
</script>
